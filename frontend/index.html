
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Sales Forecast</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        max-width: 540px;
        margin: 50px auto;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h2 {
        color: #1d4ed8;
        text-align: center;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0 16px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
    }

    input:focus {
        outline: 2px solid #93c5fd;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    #result {
        margin-top: 24px;
        font-size: 20px;
        font-weight: bold;
        text-align: center;
        color: #047857;
    }
</style>
</head>
<body>

<h2>Next Month's Car Sales Forecast</h2>
<p>Enter sales for the previous six months, starting with the most recent month.</p>

<form id="salesForm">
    <div id="inputs"></div>
    <button type="submit">Predict Sales</button>
</form>

<div id="result"></div>

<script>
    const container = document.getElementById("inputs");

    for (let i = 1; i <= 6; i++) {
        container.innerHTML += `
            <label>Month ${i} ago:</label>
            <input type="number" id="month${i}"
                   min="0" step="1" required>
        `;
    }

    document.getElementById("salesForm").addEventListener(
        "submit", async function(event) {
            event.preventDefault();

            const sales = [];

            for (let i = 1; i <= 6; i++) {
                sales.push(
                    Number(document.getElementById(`month${i}`).value)
                );
            }

            const result = document.getElementById("result");
            result.textContent = "Calculating forecast...";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ sales: sales })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        JSON.stringify(data.detail || data.error)
                    );
                }

                result.textContent =
                    "Predicted next-month sales: " +
                    Math.round(data.prediction).toLocaleString() +
                    " cars";

            } catch (error) {
                result.textContent =
                    "Prediction failed: " + error.message;
            }
        }
    );
</script>

</body>
</html>
